<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Genesis · MCP OAuth</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0f172a;
        --fg: #e2e8f0;
        --muted: #94a3b8;
        --ok: #34d399;
        --err: #f87171;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      main {
        max-width: 32rem;
        text-align: center;
        padding: 2rem;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.25rem;
        font-weight: 600;
      }
      p {
        margin: 0.5rem 0;
        color: var(--muted);
        font-size: 0.95rem;
        line-height: 1.5;
      }
      code {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
        font-size: 0.85rem;
        background: rgba(255, 255, 255, 0.06);
        padding: 0.1rem 0.4rem;
        border-radius: 4px;
      }
      .ok {
        color: var(--ok);
      }
      .err {
        color: var(--err);
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">Completing MCP authorization…</h1>
      <p id="body">You can close this tab once Genesis finishes connecting.</p>
    </main>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var code = params.get("code");
        var state = params.get("state");
        var error = params.get("error") || params.get("error_description");
        var title = document.getElementById("title");
        var body = document.getElementById("body");

        function post(payload) {
          try {
            if (window.opener && !window.opener.closed) {
              window.opener.postMessage(
                Object.assign({ source: "genesis-mcp-oauth" }, payload),
                "*",
              );
            }
          } catch (e) {
            // ignore
          }
        }

        if (error) {
          title.textContent = "Authorization failed";
          title.classList.add("err");
          body.textContent = String(error);
          post({ type: "mcp-oauth-callback", error: String(error) });
          setTimeout(function () {
            window.close();
          }, 1500);
          return;
        }
        if (!code || !state) {
          title.textContent = "Missing code or state";
          title.classList.add("err");
          body.textContent =
            "The provider did not return a code or state. Close this tab and try again.";
          post({ type: "mcp-oauth-callback", error: "Missing code or state" });
          setTimeout(function () {
            window.close();
          }, 1500);
          return;
        }
        title.textContent = "Authorization complete";
        title.classList.add("ok");
        body.textContent = "Returning to Genesis…";
        post({ type: "mcp-oauth-callback", code: code, state: state });
        setTimeout(function () {
          window.close();
        }, 800);
      })();
    </script>
  </body>
</html>
