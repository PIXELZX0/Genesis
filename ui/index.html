<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Genesis Control</title>
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <script>
      (function () {
        var MODES = { system: 1, light: 1, dark: 1 };
        // Legacy stored theme names → preserve only the user's light/dark
        // preference. Every palette now collapses to one monochrome theme.
        var LEGACY_MODE = {
          dark: "dark",
          light: "light",
          openknot: "dark",
          fieldmanual: "dark",
          clawdash: "light",
          system: "system",
          claw: "dark",
          knot: "dark",
          dash: "dark",
          custom: "dark",
        };
        try {
          var keys = Object.keys(localStorage);
          var raw;
          for (var i = 0; i < keys.length; i++) {
            if (keys[i].indexOf("genesis.control.settings.v1") === 0) {
              raw = localStorage.getItem(keys[i]);
              if (raw) break;
            }
          }
          if (!raw) return;
          var s = JSON.parse(raw);
          var t = s && typeof s.theme === "string" ? s.theme : "";
          var m = s && typeof s.themeMode === "string" ? s.themeMode : "";
          var mode = MODES[m] ? m : LEGACY_MODE[t] || "system";
          if (mode === "system") {
            mode = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          }
          document.documentElement.setAttribute("data-theme", mode);
          document.documentElement.setAttribute("data-theme-mode", mode);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <genesis-app></genesis-app>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
