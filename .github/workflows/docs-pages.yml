name: Docs Pages

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/docs-pages.yml"
      - "docs/**"
      - "site-static/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/build-github-pages-docs.mjs"
      - "scripts/protocol-gen.ts"
      - "src/gateway/protocol/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pages: write

concurrency:
  group: docs-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build docs site
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs into site/docs
        env:
          GENESIS_GITHUB_PAGES_OUT_DIR: .artifacts/site/docs
        run: node scripts/build-github-pages-docs.mjs

      - name: Generate protocol schema
        run: pnpm protocol:gen

      - name: Assemble site root
        run: |
          set -eu
          mkdir -p .artifacts/site
          # Marketing landing, installers, CNAME, privacy
          rsync -a site-static/ .artifacts/site/
          # Gateway protocol JSON schema (generated above by pnpm protocol:gen).
          cp dist/protocol.schema.json .artifacts/site/protocol.schema.json
          # Ensure .nojekyll exists at root regardless of source presence
          touch .artifacts/site/.nojekyll
          echo "--- site root listing ---"
          ls -la .artifacts/site

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .artifacts/site

  deploy:
    name: Deploy docs site
    needs: build
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
