version: 2
updates:
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    groups:
      docker-images:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: daily
    allow:
      - dependency-name: "@earendil-works/*"
    groups:
      pi:
        patterns:
          - "@earendil-works/*"
    versioning-strategy: increase
    commit-message:
      prefix: "chore(deps)"
